{% extends "base.html" %}
{% block title %}{{ error_code }} – SkillGap{% endblock %}

{% block content %}
{% if not user %}
<nav class="navbar">
  <div class="container">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 36 32" width="32" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="2" y="18" width="8" height="14" rx="2" fill="var(--accent)"/>
        <rect x="14" y="10" width="8" height="22" rx="2" stroke="var(--accent)" stroke-width="2" fill="none"/>
        <rect x="26" y="2" width="8" height="30" rx="2" fill="var(--accent)"/>
      </svg>
      <span>SkillGap</span>
    </a>
  </div>
</nav>
{% endif %}

<div class="page-content">
  <div class="container">
    <div class="empty-state">
      <div class="empty-state-icon">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          {% if error_code == 404 %}
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          {% else %}
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>
          {% endif %}
        </svg>
      </div>
      <h3 style="font-size:3rem;font-weight:800;margin-bottom:8px;color:var(--text-primary)">{{ error_code }}</h3>
      <h3>{{ error_message }}</h3>
      <p>{{ error_detail }}</p>
      <a href="{% if user %}/dashboard{% else %}/{% endif %}" class="btn btn-primary">Go to {% if user %}dashboard{% else %}home{% endif %}</a>
    </div>
  </div>
</div>
{% endblock %}
