<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 170 36" width="170" height="36" fill="none">
  <!-- Ascending Bars Mark with Middle Gap -->
  <g transform="translate(2, 2)">
    <!-- Left bar: solid teal, height 18 -->
    <rect x="0" y="14" width="7" height="18" rx="2" fill="#0D9488" />
    <!-- Middle bar: outline only (the gap), height 24 -->
    <rect x="11" y="8" width="7" height="24" rx="2" stroke="#0D9488" stroke-width="2" fill="none" />
    <!-- Right bar: solid teal, height 32 -->
    <rect x="22" y="0" width="7" height="32" rx="2" fill="#0D9488" />
  </g>
  <!-- Wordmark "SkillGap" -->
  <text x="42" y="25" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="currentColor">
    Skill<tspan fill="#0D9488">Gap</tspan>
  </text>
</svg>
