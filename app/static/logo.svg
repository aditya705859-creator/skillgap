<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 44" width="200" height="44" fill="none">
  <defs>
    <!-- Premium Indigo to Violet Gradient -->
    <linearGradient id="sgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <linearGradient id="badgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Monogram SG Badge -->
  <g transform="translate(2, 2)">
    <!-- Rounded Outer Hex/Shield Container -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#badgeGlow)" stroke="#6366F1" stroke-width="1.5" stroke-opacity="0.4" />
    
    <!-- Stylized Interlocking S and G with Negative Space Gap -->
    <!-- Top S-curve loop -->
    <path d="M 26 12 C 26 10 23 8.5 20 8.5 C 15.5 8.5 12 11.5 12 15.5 C 12 21 27 19.5 27 25 C 27 29.5 23 32 18.5 32 C 14.5 32 12 30 11.5 27.5" 
          stroke="url(#sgGradient)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Negative Space Cut / Intersecting Gap Arrow -->
    <line x1="17.5" y1="16.5" x2="22.5" y2="23.5" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2.5" stroke-linecap="round" />

    <!-- G Spur / Arrow completing the gap -->
    <path d="M 23 25 L 28 25 L 28 20" 
          stroke="url(#sgGradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Center Bridge Node (Closing the Gap) -->
    <circle cx="20" cy="20" r="2.2" fill="#818CF8" />
  </g>

  <!-- Wordmark "SkillGap" -->
  <text x="52" y="29" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" letter-spacing="-0.03em" fill="currentColor">
    Skill<tspan fill="url(#sgGradient)">Gap</tspan>
  </text>
</svg>
